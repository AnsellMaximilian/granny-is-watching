<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' blob: ws:; object-src 'none'; base-uri 'none'" />
  <title>Granny is Watching</title>
</head>
<body>
  <main>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="lens" aria-hidden="true"></div>
    <div id="eyelids" aria-hidden="true"></div>
    <div id="ending-shade" class="ending-shade" aria-hidden="true"></div>
    <button id="sound-toggle" class="sound-toggle" type="button" aria-label="Mute sound" aria-pressed="true">Sound on</button>
    <aside id="spectra-panel" class="spectra-panel" aria-label="Camera and detected signals" data-state="off">
      <header class="spectra-heading">
        <h2><span id="spectra-light" aria-hidden="true"></span> Camera &amp; signals</h2>
        <button id="spectra-collapse" type="button" aria-expanded="true" aria-controls="spectra-body" aria-label="Collapse camera panel">−</button>
      </header>
      <div id="spectra-body">
        <div id="spectra-preview" class="spectra-preview" hidden>
          <video id="spectra-video" autoplay muted playsinline aria-label="Your live camera feed"></video>
          <span id="spectra-camera-name">Live camera</span>
        </div>
        <p id="spectra-status" class="spectra-status" role="status">Camera off</p>
        <p id="spectra-hint" class="spectra-hint">Enable your camera to check facial signals.</p>
        <div id="spectra-readings" hidden>
          <dl id="spectra-primary" class="spectra-signals"></dl>
        </div>
        <label id="spectra-camera-picker" class="spectra-camera-picker" hidden>Camera
          <select id="spectra-camera" aria-label="Choose camera"></select>
        </label>
        <details id="spectra-settings" class="spectra-settings" hidden>
          <summary>API key</summary>
          <form id="spectra-key-form">
            <label for="spectra-key">SmartSpectra key · this session only</label>
            <input id="spectra-key" type="password" autocomplete="off" spellcheck="false" maxlength="1024" placeholder="Paste your API key" />
            <button type="submit">Use key</button>
          </form>
        </details>
        <div class="spectra-controls">
          <button id="spectra-toggle" type="button" disabled>Enable camera</button>
          <button id="spectra-retry" type="button" hidden>Retry signals</button>
        </div>
        <p class="spectra-note">Preview only · signals do not affect play</p>
      </div>
    </aside>
    <section id="intro" class="intro" aria-labelledby="game-title">
      <h1 id="game-title">Granny is<br />Watching</h1>
      <button id="wake" class="action" type="button" disabled>Loading…</button>
    </section>
    <section id="invitation" class="invitation" aria-label="Granny's invitation" hidden>
      <p>“Duduk.”</p>
      <button id="sit" class="action" type="button">Sit down</button>
    </section>
    <section id="burn-dialogue" class="burn-dialogue" aria-label="Granny’s dialogue" hidden>
      <p class="dialogue-speaker">Granny</p>
      <p id="granny-line" class="dialogue-line" aria-live="polite"></p>
      <button id="dialogue-continue" class="action" type="button" aria-describedby="granny-line"></button>
    </section>
    <section id="match" aria-label="Congklak" hidden>
      <header class="scoreboard">
        <div class="score player"><span>You</span><strong id="player-score">0</strong></div>
        <div class="round-heading">
          <h2>Congklak</h2>
          <p id="round-label">Round 1</p>
        </div>
        <div class="score granny"><span>Granny</span><strong id="granny-score">0</strong></div>
      </header>
      <div id="pit-layer" class="pit-layer" aria-label="Congklak pits"></div>
      <button id="rulebook-button" class="rulebook-button" type="button"><span>Rulebook</span></button>
      <footer class="turn">
        <h3 id="turn-title" aria-live="polite">Your turn</h3>
        <p id="turn-hint">Choose an occupied pit on the near row.</p>
        <p id="hand-count" hidden></p>
      </footer>
    </section>
    <section id="book-reader" class="book-reader" aria-label="Congklak rulebook" hidden>
      <p id="book-text" class="visually-hidden" aria-live="polite"></p>
      <button id="book-previous" class="action" type="button">Previous</button>
      <span id="book-page" class="book-page"></span>
      <button id="book-next" class="action" type="button">Next</button>
      <button id="book-close" class="action" type="button">Close</button>
    </section>
    <section id="result" class="result" aria-labelledby="result-title" hidden>
      <div class="result-card">
        <h2 id="result-title"></h2>
        <p id="result-score"></p>
        <button id="again" class="action" type="button">Start a new run</button>
      </div>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
