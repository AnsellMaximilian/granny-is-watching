name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example v0.1.0-alpha.1). Creates a draft only.'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Use the lockfile's npm version
        run: npm install --global npm@11.19.1
      - run: npm ci
      - name: Install the Windows native runtime prerequisite
        run: |
          $vcRuntime = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vc14/vc_redist.x64.exe' -OutFile $vcRuntime
          $signature = Get-AuthenticodeSignature -LiteralPath $vcRuntime
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation,') {
            throw 'The Visual C++ runtime installer did not have a valid Microsoft signature.'
          }
          $installation = Start-Process -FilePath $vcRuntime -ArgumentList '/install', '/quiet', '/norestart' -WindowStyle Hidden -Wait -PassThru
          if ($installation.ExitCode -notin @(0, 1638, 3010)) {
            throw ('Visual C++ runtime installation failed: ' + $installation.ExitCode)
          }
      - name: Validate release version and source commit
        id: version
        run: node scripts/prepare-release.mjs
      - run: npm test
      - name: Package installer and ZIP
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Optional exportable Windows signing certificate (PFX as base64) and password.
          # Empty secrets produce unsigned preview builds; no SmartSpectra key belongs here.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - run: npm run verify:package
      - name: Launch the application extracted from the release ZIP
        run: |
          $zip = Join-Path 'release' ('Granny-is-Watching-' + $env:RELEASE_VERSION + '-win-x64.zip')
          $zipAppDir = Join-Path $env:RUNNER_TEMP 'granny-release'
          Expand-Archive -LiteralPath $zip -DestinationPath $zipAppDir
          npm run verify:package -- "$zipAppDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run smoke:package -- "$zipAppDir"
      - run: npm run release:checksums
      - name: Keep installer, ZIP and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-${{ steps.version.outputs.version }}
          path: |
            release/*-setup.exe
            release/*-win-x64.zip
            release/SHA256SUMS.txt
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Keep packaged smoke-test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/packaged-smoke.log
            release/packaged-smoke.png
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Prepare draft release
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Use the lockfile's npm version
        run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Download tested release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-${{ needs.build.outputs.version }}
          path: release
      - name: Upload assets to a draft GitHub Release
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
